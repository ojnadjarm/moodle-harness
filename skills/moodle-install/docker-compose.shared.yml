# Shared services for every Moodle environment: one nginx (moodle<MM>.localhost -> app),
# one mailhog and one selenium on the `moodle-shared` network that each app container joins.
# Start with: docker compose up -d   (services restart unless-stopped, so they come back after a reboot)
name: moodle-shared
services:
  proxy:
    restart: unless-stopped
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  mailhog:
    restart: unless-stopped
    image: mailhog/mailhog
    logging:
      driver: none
    ports:
      - "1025:1025"
      - "8025:8025"
  selenium:
    restart: unless-stopped
    image: moodlehq/selenium-standalone-chrome:96.0-moodlehq
    hostname: selenium
    privileged: true
    shm_size: 2g
    ports:
      - "4444:4444"
      - "5900:5900"
      - "7900:7900"
    volumes:
      - /dev/shm:/dev/shm
networks:
  default:
    name: moodle-shared
